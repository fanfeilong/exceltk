name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Exceltk/Exceltk.csproj

      - name: Build
        run: dotnet build src/Exceltk/Exceltk.csproj -c Release --no-restore

      - name: Regression tests
        working-directory: src
        run: bash test.sh
