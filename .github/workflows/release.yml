name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${ref#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${ref}"
          else
            # workflow_dispatch on a branch: use short SHA so artifacts are still named
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Publish multi-RID packages
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          PROJECT="src/Exceltk/Exceltk.csproj"
          mkdir -p dist

          for rid in linux-x64 osx-x64 osx-arm64 win-x86; do
            out="publish/${rid}"
            echo "::group::Publish ${rid}"
            dotnet publish "$PROJECT" \
              -c Release \
              -r "$rid" \
              --self-contained true \
              -o "$out" \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true
            echo "::endgroup::"

            if [[ "$rid" == win-* ]]; then
              asset="dist/exceltk-${VERSION}-${rid}.zip"
              (cd "$out" && zip -qr "../../${asset}" .)
            else
              asset="dist/exceltk-${VERSION}-${rid}.tar.gz"
              tar -czf "$asset" -C "$out" .
            fi
            ls -lh "$asset"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exceltk-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
